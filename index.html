:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

            &lt;div class=&quot;f365-section-head&quot;&gt;&lt;div class=&quot;f365-section-title&quot;&gt;&lt;span class=&quot;f365-num amber&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;h3&gt;听力与跟读&lt;/h3&gt;&lt;p&gt;浏览器直接播放 · 约 1-3 分钟&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;f365-complete&quot; data-task=&quot;listening&quot;&gt;标记完成&lt;/button&gt;&lt;/div&gt;
            &lt;div class=&quot;f365-player&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;f365-play&quot; id=&quot;f365-play&quot; aria-label=&quot;播放听力&quot;&gt;&lt;i data-lucide=&quot;play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
              &lt;div class=&quot;f365-audio-info&quot;&gt;&lt;strong id=&quot;f365-listening-title&quot;&gt;&lt;/strong&gt;&lt;div class=&quot;f365-track&quot;&gt;&lt;i id=&quot;f365-audio-bar&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;small id=&quot;f365-audio-status&quot;&gt;准备播放&lt;/small&gt;&lt;/div&gt;
              &lt;select class=&quot;f365-rate&quot; id=&quot;f365-rate&quot; aria-label=&quot;听力语速&quot;&gt;&lt;option value=&quot;.75&quot;&gt;0.75×&lt;/option&gt;&lt;option value=&quot;.9&quot; selected&gt;0.9×&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;1.0×&lt;/option&gt;&lt;option value=&quot;1.15&quot;&gt;1.15×&lt;/option&gt;&lt;/select&gt;
            &lt;/div&gt;
            &lt;div class=&quot;f365-listen-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;f365-text-button&quot; id=&quot;f365-transcript-toggle&quot;&gt;显示听力原文&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;f365-text-button&quot; id=&quot;f365-sentence-play&quot;&gt;逐句跟读&lt;/button&gt;&lt;/div&gt;
            &lt;div class=&quot;f365-transcript f365-hidden&quot; id=&quot;f365-transcript&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;f365-steps&quot;&gt;&lt;div&gt;&lt;strong&gt;1 · 盲听&lt;/strong&gt;&lt;span&gt;不看原文听一遍，记下关键词。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;2 · 跟读&lt;/strong&gt;&lt;span&gt;逐句模仿重音、语调和停顿。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;3 · 复述&lt;/strong&gt;&lt;span&gt;用 4-5 句话说出核心信息。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;f365-questions&quot;&gt;&lt;h4&gt;听力问题&lt;/h4&gt;&lt;ol id=&quot;f365-listening-questions&quot;&gt;&lt;/ol&gt;&lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;f365-section&quot;&gt;
            &lt;div class=&quot;f365-section-head&quot;&gt;&lt;div class=&quot;f365-section-title&quot;&gt;&lt;span class=&quot;f365-num blue&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;h3&gt;90 秒口语&lt;/h3&gt;&lt;p&gt;先完整表达，再修正语法&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;f365-complete&quot; data-task=&quot;speaking&quot;&gt;标记完成&lt;/button&gt;&lt;/div&gt;
            &lt;div class=&quot;f365-speaking&quot;&gt;
              &lt;div&gt;&lt;small&gt;TODAY&#x27;S PROMPT&lt;/small&gt;&lt;h4 id=&quot;f365-speaking-prompt&quot;&gt;&lt;/h4&gt;&lt;p id=&quot;f365-speaking-hints&quot;&gt;&lt;/p&gt;&lt;/div&gt;
              &lt;button type=&quot;button&quot; class=&quot;f365-timer&quot; id=&quot;f365-speaking-timer&quot;&gt;&lt;strong id=&quot;f365-timer-value&quot;&gt;01:30&lt;/strong&gt;&lt;small&gt;开始计时&lt;/small&gt;&lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;f365-guide&quot;&gt;
              &lt;strong&gt;口语表达路线&lt;/strong&gt;
              &lt;p id=&quot;f365-speaking-structure&quot;&gt;&lt;/p&gt;
              &lt;strong&gt;今天可以套用&lt;/strong&gt;
              &lt;p id=&quot;f365-speaking-phrases&quot;&gt;&lt;/p&gt;
              &lt;p class=&quot;f365-guide-note&quot;&gt;先看中文提示，尝试自己说；卡住时再用下面的中文翻译工具。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div class=&quot;f365-translation&quot;&gt;
              &lt;div class=&quot;f365-translation-head&quot;&gt;&lt;strong&gt;中文转英文 · 口语助手&lt;/strong&gt;&lt;span&gt;可输入或用中文说&lt;/span&gt;&lt;/div&gt;
              &lt;textarea id=&quot;f365-speaking-chinese&quot; placeholder=&quot;先用中文写关键词或完整句子，例如：我通常提前两小时到机场。&quot;&gt;&lt;/textarea&gt;
              &lt;div class=&quot;f365-translation-actions&quot;&gt;
                &lt;button type=&quot;button&quot; class=&quot;f365-translation-button&quot; id=&quot;f365-speaking-record&quot;&gt;&lt;i data-lucide=&quot;mic&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;中文语音输入&lt;/button&gt;
                &lt;button type=&quot;button&quot; class=&quot;f365-translation-button primary&quot; id=&quot;f365-speaking-translate&quot;&gt;&lt;i data-lucide=&quot;languages&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;翻译成英文&lt;/button&gt;
              &lt;/div&gt;
              &lt;p class=&quot;f365-translation-status&quot; id=&quot;f365-speaking-translation-status&quot;&gt;建议先自己说一遍，再查看翻译。&lt;/p&gt;
              &lt;div class=&quot;f365-translation-result f365-hidden&quot; id=&quot;f365-speaking-translation-result&quot;&gt;
                &lt;span&gt;ENGLISH VERSION&lt;/span&gt;&lt;p id=&quot;f365-speaking-translation-text&quot;&gt;&lt;/p&gt;
                &lt;div class=&quot;f365-translation-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;f365-translation-button&quot; id=&quot;f365-speaking-speak-translation&quot;&gt;&lt;i data-lucide=&quot;volume-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;朗读英文&lt;/button&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;f365-section&quot;&gt;
            &lt;div class=&quot;f365-section-head&quot;&gt;&lt;div class=&quot;f365-section-title&quot;&gt;&lt;span class=&quot;f365-num&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;h3&gt;实用表达&lt;/h3&gt;&lt;p&gt;点击英文表达可单独朗读&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;f365-complete&quot; data-task=&quot;vocab&quot;&gt;标记完成&lt;/button&gt;&lt;/div&gt;
            &lt;table class=&quot;f365-vocab&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;英文表达&lt;/th&gt;&lt;th&gt;中文&lt;/th&gt;&lt;th&gt;例句&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;f365-vocab-body&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;
          &lt;/section&gt;

          &lt;section class=&quot;f365-section&quot;&gt;
            &lt;div class=&quot;f365-section-head&quot;&gt;&lt;div class=&quot;f365-section-title&quot;&gt;&lt;span class=&quot;f365-num coral&quot;&gt;06&lt;/span&gt;&lt;div&gt;&lt;h3&gt;写作与复盘&lt;/h3&gt;&lt;p&gt;写完后大声读一遍&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;f365-complete&quot; data-task=&quot;writing&quot;&gt;标记完成&lt;/button&gt;&lt;/div&gt;
            &lt;div class=&quot;f365-writing&quot;&gt;
              &lt;label for=&quot;f365-writing&quot; id=&quot;f365-writing-prompt&quot;&gt;&lt;/label&gt;
              &lt;textarea id=&quot;f365-writing&quot; placeholder=&quot;Start writing in English...&quot;&gt;&lt;/textarea&gt;
              &lt;div class=&quot;f365-writing-foot&quot;&gt;&lt;span&gt;建议使用今天的 3 个新表达&lt;/span&gt;&lt;strong&gt;&lt;span id=&quot;f365-writing-count&quot;&gt;0&lt;/span&gt; / 80 words&lt;/strong&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;f365-guide&quot;&gt;
              &lt;strong&gt;写作结构提示&lt;/strong&gt;
              &lt;p id=&quot;f365-writing-structure&quot;&gt;&lt;/p&gt;
              &lt;strong&gt;检查清单&lt;/strong&gt;
              &lt;p id=&quot;f365-writing-checklist&quot;&gt;有没有先表达主题？有没有给出原因或例子？有没有使用 because / however / as a result 等连接词？最后大声读一遍。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div class=&quot;f365-translation&quot;&gt;
              &lt;div class=&quot;f365-translation-head&quot;&gt;&lt;strong&gt;中文转英文 · 写作助手&lt;/strong&gt;&lt;span&gt;先想清楚，再润色&lt;/span&gt;&lt;/div&gt;
              &lt;textarea id=&quot;f365-writing-chinese&quot; placeholder=&quot;先用中文列出想表达的内容，例如：我认为长期投资需要耐心，因为市场每天都会波动。&quot;&gt;&lt;/textarea&gt;
              &lt;div class=&quot;f365-translation-actions&quot;&gt;
                &lt;button type=&quot;button&quot; class=&quot;f365-translation-button&quot; id=&quot;f365-writing-record&quot;&gt;&lt;i data-lucide=&quot;mic&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;中文语音输入&lt;/button&gt;
                &lt;button type=&quot;button&quot; class=&quot;f365-translation-button primary&quot; id=&quot;f365-writing-translate&quot;&gt;&lt;i data-lucide=&quot;languages&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;翻译成英文&lt;/button&gt;
              &lt;/div&gt;
              &lt;p class=&quot;f365-translation-status&quot; id=&quot;f365-writing-translation-status&quot;&gt;不要逐字依赖翻译，先自己组织意思。&lt;/p&gt;
              &lt;div class=&quot;f365-translation-result f365-hidden&quot; id=&quot;f365-writing-translation-result&quot;&gt;
                &lt;span&gt;ENGLISH VERSION&lt;/span&gt;&lt;p id=&quot;f365-writing-translation-text&quot;&gt;&lt;/p&gt;
                &lt;div class=&quot;f365-translation-actions&quot;&gt;
                  &lt;button type=&quot;button&quot; class=&quot;f365-translation-button&quot; id=&quot;f365-writing-speak-translation&quot;&gt;&lt;i data-lucide=&quot;volume-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;朗读英文&lt;/button&gt;
                  &lt;button type=&quot;button&quot; class=&quot;f365-translation-button&quot; id=&quot;f365-writing-use-translation&quot;&gt;&lt;i data-lucide=&quot;arrow-down-to-line&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;填入写作框&lt;/button&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;f365-review&quot;&gt;&lt;p&gt;5 分钟复盘：说出今天学到的 3 个表达，并各造一个新句子。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;f365-complete&quot; data-task=&quot;review&quot;&gt;完成复盘&lt;/button&gt;&lt;/div&gt;
          &lt;/section&gt;
        &lt;/div&gt;

        &lt;aside class=&quot;f365-aside&quot;&gt;
          &lt;div class=&quot;f365-side-panel f365-daily-progress&quot;&gt;&lt;div class=&quot;f365-ring&quot; id=&quot;f365-ring&quot;&gt;&lt;span id=&quot;f365-percent&quot;&gt;0%&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;今日进度&lt;/strong&gt;&lt;p&gt;&lt;span id=&quot;f365-done&quot;&gt;0&lt;/span&gt; / 6 项已完成&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;f365-side-panel&quot;&gt;&lt;small&gt;今日目标&lt;/small&gt;&lt;p id=&quot;f365-goal&quot;&gt;&lt;/p&gt;&lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;f365-checkin&quot; id=&quot;f365-checkin&quot;&gt;完成今日打卡&lt;/button&gt;
          &lt;p class=&quot;f365-save&quot;&gt;记录自动保存在本机浏览器&lt;/p&gt;
        &lt;/aside&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;f365-view&quot; id=&quot;f365-calendar-view&quot;&gt;
      &lt;div class=&quot;f365-page-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;f365-eyebrow&quot;&gt;YOUR 365-DAY ROUTE&lt;/p&gt;&lt;h2&gt;学习日历&lt;/h2&gt;&lt;/div&gt;
        &lt;div class=&quot;f365-month-switch&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;f365-prev-month&quot; aria-label=&quot;上一个学习月&quot;&gt;‹&lt;/button&gt;&lt;strong id=&quot;f365-month-label&quot;&gt;第 1 月&lt;/strong&gt;&lt;button type=&quot;button&quot; id=&quot;f365-next-month&quot; aria-label=&quot;下一个学习月&quot;&gt;›&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;section class=&quot;f365-stage&quot;&gt;
        &lt;span class=&quot;f365-stage-index&quot; id=&quot;f365-stage-index&quot;&gt;01&lt;/span&gt;
        &lt;div&gt;&lt;small&gt;CURRENT STAGE&lt;/small&gt;&lt;h3 id=&quot;f365-stage-title&quot;&gt;建立开口习惯&lt;/h3&gt;&lt;p id=&quot;f365-stage-description&quot;&gt;用熟悉主题激活已有词汇，从短句表达过渡到 90 秒连续表达。&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;f365-stage-target&quot;&gt;&lt;strong id=&quot;f365-stage-target&quot;&gt;B1 → B1+&lt;/strong&gt;&lt;small&gt;本月目标&lt;/small&gt;&lt;/div&gt;
      &lt;/section&gt;
      &lt;div class=&quot;f365-calendar&quot; id=&quot;f365-calendar&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;f365-legend&quot;&gt;
        &lt;span&gt;&lt;i style=&quot;background:var(--f365-coral)&quot;&gt;&lt;/i&gt;旅游&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--f365-blue)&quot;&gt;&lt;/i&gt;运动&lt;/span&gt;
        &lt;span&gt;&lt;i style=&quot;background:#8b6bb1&quot;&gt;&lt;/i&gt;学习&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--f365-amber)&quot;&gt;&lt;/i&gt;股票&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--f365-green)&quot;&gt;&lt;/i&gt;币圈&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;f365-view&quot; id=&quot;f365-exam-view&quot;&gt;
      &lt;div class=&quot;f365-page-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;f365-eyebrow&quot;&gt;MONTHLY CHECKPOINT&lt;/p&gt;&lt;h2&gt;月度英语测试&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;f365-streak&quot;&gt;&lt;strong&gt;100&lt;/strong&gt; 总分&lt;/div&gt;&lt;/div&gt;
      &lt;section class=&quot;f365-exam-intro&quot; id=&quot;f365-exam-intro&quot;&gt;
        &lt;div&gt;&lt;span class=&quot;f365-topic&quot;&gt;阅读 · 听力 · 口语 · 写作 · 词汇&lt;/span&gt;&lt;h3&gt;检验你是否能把学过的英语真正用出来&lt;/h3&gt;&lt;p&gt;共 5 部分，建议一次完成。客观题自动评分，口语和写作依据标准自评。&lt;/p&gt;&lt;div class=&quot;f365-exam-meta&quot;&gt;&lt;span&gt;45 分钟&lt;/span&gt;&lt;span&gt;5 个部分&lt;/span&gt;&lt;span&gt;80 分达标&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;button type=&quot;button&quot; class=&quot;f365-primary&quot; id=&quot;f365-start-exam&quot;&gt;开始测试&lt;/button&gt;
      &lt;/section&gt;
      &lt;div class=&quot;f365-hidden&quot; id=&quot;f365-exam-content&quot;&gt;
        &lt;div class=&quot;f365-exam-toolbar&quot;&gt;&lt;span&gt;剩余时间 &lt;strong id=&quot;f365-exam-timer&quot;&gt;45:00&lt;/strong&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f365-primary&quot; id=&quot;f365-submit-exam&quot;&gt;提交测试&lt;/button&gt;&lt;/div&gt;
        &lt;section class=&quot;f365-exam-part&quot;&gt;
          &lt;h3&gt;Part 1 · 阅读理解（15 分）&lt;/h3&gt;&lt;p&gt;阅读文章，选择最佳答案。&lt;/p&gt;
          &lt;div class=&quot;f365-exam-passage&quot;&gt;Many people think fluency means speaking without any mistakes. In reality, fluent speakers still pause, change their words, and sometimes correct themselves. What matters most is whether they can keep the conversation moving. A useful strategy is to learn groups of words, such as “That reminds me of…” or “What I mean is…”. These chunks give the speaker time to think and make ideas easier to connect. Regular short practice is also more effective than one long session each week. Ten focused minutes every day can build stronger habits than two hours on Sunday.&lt;/div&gt;
          &lt;div class=&quot;f365-question&quot;&gt;&lt;p&gt;1. What is the main idea?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r1&quot; value=&quot;a&quot;&gt; Fluent speakers never make mistakes.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r1&quot; value=&quot;b&quot;&gt; Fluency is about keeping communication moving.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r1&quot; value=&quot;c&quot;&gt; Sunday is the best day to study.&lt;/label&gt;&lt;/div&gt;
          &lt;div class=&quot;f365-question&quot;&gt;&lt;p&gt;2. Why are word chunks useful?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r2&quot; value=&quot;a&quot;&gt; They help connect ideas and buy thinking time.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r2&quot; value=&quot;b&quot;&gt; They remove the need for grammar.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r2&quot; value=&quot;c&quot;&gt; They make every sentence longer.&lt;/label&gt;&lt;/div&gt;
          &lt;div class=&quot;f365-question&quot;&gt;&lt;p&gt;3. Which practice routine does the writer prefer?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r3&quot; value=&quot;a&quot;&gt; One long session every month.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r3&quot; value=&quot;b&quot;&gt; Two hours every Sunday only.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;r3&quot; value=&quot;c&quot;&gt; Short, focused daily practice.&lt;/label&gt;&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;f365-exam-part&quot;&gt;
          &lt;h3&gt;Part 2 · 听力理解（15 分）&lt;/h3&gt;&lt;p&gt;播放两遍以内，不看原文完成选择。&lt;/p&gt;
          &lt;button type=&quot;button&quot; class=&quot;f365-exam-audio&quot; id=&quot;f365-exam-audio&quot;&gt;&lt;i data-lucide=&quot;headphones&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 播放月考听力&lt;/button&gt;
          &lt;div class=&quot;f365-question&quot;&gt;&lt;p&gt;4. Where is the speaker going?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l1&quot; value=&quot;a&quot;&gt; Bangkok.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l1&quot; value=&quot;b&quot;&gt; Singapore.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l1&quot; value=&quot;c&quot;&gt; Tokyo.&lt;/label&gt;&lt;/div&gt;
          &lt;div class=&quot;f365-question&quot;&gt;&lt;p&gt;5. Why did the speaker choose a small hotel?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l2&quot; value=&quot;a&quot;&gt; It has a swimming pool.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l2&quot; value=&quot;b&quot;&gt; It is near the station.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l2&quot; value=&quot;c&quot;&gt; It offers free meals.&lt;/label&gt;&lt;/div&gt;
          &lt;div class=&quot;f365-question&quot;&gt;&lt;p&gt;6. What will the speaker do on Saturday morning?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l3&quot; value=&quot;a&quot;&gt; Visit a local market.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l3&quot; value=&quot;b&quot;&gt; Attend a business meeting.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;l3&quot; value=&quot;c&quot;&gt; Watch a football match.&lt;/label&gt;&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;f365-exam-part&quot;&gt;
          &lt;h3&gt;Part 3 · 词汇表达（20 分）&lt;/h3&gt;&lt;p&gt;选择最自然的表达。&lt;/p&gt;
          &lt;div class=&quot;f365-question&quot;&gt;&lt;p&gt;7. I try to think ___ when the market falls.&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;v1&quot; value=&quot;a&quot;&gt; long-term&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;v1&quot; value=&quot;b&quot;&gt; long time ago&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;v1&quot; value=&quot;c&quot;&gt; at a long&lt;/label&gt;&lt;/div&gt;

          subtitle:&#x27;从值机到登机，用自然英语解决机场里的真实问题。&#x27;, guide:&#x27;先快速阅读，再圈出机场场景中的动词短语&#x27;,

          listening:&#x27;Good morning. I would like to check in for flight 218 to Singapore. Here is my passport. I have one suitcase to check and one small bag to carry on. Could I have an aisle seat, if one is available? Thank you. What time does boarding begin? I see that the flight is delayed by twenty minutes. Has the gate changed as well? Great, so I should be at gate twelve by ten thirty. Could you also tell me where the security check is? Thanks for your help.&#x27;,

          subtitle:&#x27;学习描述运动习惯、训练目标和身体感受。&#x27;, guide:&#x27;关注频率表达和描述习惯变化的句型&#x27;,
          readingTitle:&#x27;The Workout You Can Actually Keep&#x27;,
          reading:[
            &#x27;Many people begin a new exercise plan with too much energy. They train hard every day, feel exhausted after one week, and then stop completely. A sustainable routine looks different. It begins with a goal that fits real life.&#x27;,
            &#x27;For example, Daniel wanted to become stronger, but he only had thirty minutes after work. He decided to exercise three times a week. On two days, he did basic strength training. On the third day, he went for a relaxed run. He also tracked how he felt instead of only checking his weight.&#x27;,
            &#x27;After two months, Daniel was not training like a professional athlete, but he had more energy and rarely skipped a workout. His progress came from consistency, not intensity. A modest plan that lasts is more valuable than a perfect plan that disappears after ten days.&#x27;

          readingQuestions:[&#x27;Why do some new exercise plans fail quickly?&#x27;,&#x27;How often did Daniel exercise?&#x27;,&#x27;What did Daniel learn about progress?&#x27;],
          listeningTitle:&#x27;Talking About a Weekly Routine&#x27;,
          listening:&#x27;I started working out regularly about six months ago. At first, I tried to exercise every day, but that was difficult to maintain. Now I train three times a week. I usually do strength training on Monday and Thursday, and I go for a slow run on Saturday morning. My goal is not to become a professional athlete. I simply want to feel stronger and have more energy during the day. When I am busy, I shorten the workout instead of skipping it. That small change has helped me stay consistent.&#x27;,

          writing:&#x27;用 80-100 词设计一套你能坚持三个月的运动计划。&#x27;, writingStructure:&#x27;先写目标 → 安排每周频率 → 说明具体训练 → 写出遇到忙碌时的替代方案。&#x27;, goal:&#x27;能用频率、目标和原因清楚介绍自己的运动习惯。&#x27;

          subtitle:&#x27;用英语谈学习方法，并练习解释原因和效果。&#x27;, guide:&#x27;留意比较不同学习方法时使用的连接词&#x27;,
          readingTitle:&#x27;Why Testing Yourself Helps You Learn&#x27;,
          reading:[
            &#x27;Reading the same notes again and again can feel productive, but that feeling may be misleading. When information looks familiar, we often believe we have learned it. However, recognizing an answer is not the same as recalling it without help.&#x27;,
            &#x27;A more effective method is active recall. After studying a short section, close the book and write down everything you remember. Then compare your answer with the original material. The missing details show you exactly what to review.&#x27;,
            &#x27;This method may feel harder than rereading because your brain must search for information. That effort is useful. It strengthens the path to the memory and makes the information easier to retrieve later. Short quizzes, flashcards, and spoken summaries are all forms of active recall. The goal is not to prove that you know everything; it is to discover what still needs work.&#x27;
          ],
          keywords:[[&#x27;feel productive&#x27;,&#x27;感觉有效率&#x27;,&#x27;Highlighting can feel productive.&#x27;],[&#x27;misleading&#x27;,&#x27;误导性的&#x27;,&#x27;That result may be misleading.&#x27;],[&#x27;recall&#x27;,&#x27;回忆&#x27;,&#x27;Try to recall the main points.&#x27;],[&#x27;without help&#x27;,&#x27;没有帮助&#x27;,&#x27;Can you explain it without help?&#x27;],[&#x27;compare with&#x27;,&#x27;与……比较&#x27;,&#x27;Compare your answer with the text.&#x27;],[&#x27;missing detail&#x27;,&#x27;遗漏细节&#x27;,&#x27;Find the missing details.&#x27;],[&#x27;retrieve&#x27;,&#x27;提取记忆&#x27;,&#x27;It becomes easier to retrieve.&#x27;],[&#x27;active recall&#x27;,&#x27;主动回忆&#x27;,&#x27;Active recall improves memory.&#x27;]],

          topic:&#x27;stocks&#x27;, label:&#x27;股票 · 风险表达&#x27;, category:&#x27;MARKETS&#x27;, title:&#x27;Read the market, not the noise.&#x27;,
          subtitle:&#x27;练习描述市场波动，并用清楚、克制的英语表达投资风险。&#x27;, guide:&#x27;先读懂大意，再关注风险和长期投资表达&#x27;,
          readingTitle:&#x27;Why Calm Investors Make Better Decisions&#x27;,
          reading:[
            &#x27;Stock prices move every day, sometimes for clear reasons and sometimes because investors react to uncertainty. A company may report strong profits, launch a new product, or face unexpected costs. Interest rates and economic news can also change how people value a business.&#x27;,
            &#x27;When prices fall suddenly, inexperienced investors often feel pressure to sell. However, a lower price does not always mean that the company has become a bad business. Calm investors separate short-term market noise from long-term facts. They review the company’s earnings, debt, competitive position, and future plans.&#x27;,
